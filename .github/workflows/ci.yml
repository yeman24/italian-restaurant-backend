name: Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://aura:aura_secret@localhost:5432/aura_db?schema=public
      JWT_ACCESS_SECRET: ci_test_access_jwt_secret_aura_2025
      JWT_REFRESH_SECRET: ci_test_refresh_jwt_secret_aura_2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run unit tests
        run: npm test

      - name: Build NestJS application
        run: npm run build
