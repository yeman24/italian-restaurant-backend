services:
  - type: web
    name: aura-edinburgh-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: aura-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: RESTAURANT_TIMEZONE
        value: Europe/London
      - key: RESERVATION_HORIZON_DAYS
        value: "90"
      - key: RESERVATION_POLICY_VERSION
        value: 2026-01
      - key: DEPOSIT_REQUIRED
        value: "false"
      - key: FRONTEND_URL
        sync: false

databases:
  - name: aura-db
    plan: free
    region: frankfurt
